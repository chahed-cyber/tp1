<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cap Bon Explorer - Simulateur de Réservation</title>
  <!-- Bootstrap 5.3.3 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
      <div class="container">
        <a class="navbar-brand fw-bold" href="index.html">🌊 Cap Bon Explorer</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
          <ul class="navbar-nav">
            <li class="nav-item"><a class="nav-link" href="index.html">Accueil</a></li>
            <li class="nav-item"><a class="nav-link" href="ac">Activités</a></li>
            <li class="nav-item"><a class="nav-link" href="agenda.html">Agenda</a></li>
            <li class="nav-item"><a class="nav-link active" href="reservation.html">Réservation</a></li>
            <li class="nav-item"><a class="nav-link" href="contact.html">Contact/FAQ</a></li>
          </ul>
        </div>
      </div>
    </nav>
  </header>

  <main style="margin-top: 56px;" class="container py-5">
    <h1 class="text-center mb-4">Simulateur de Réservation</h1>
    
    <div class="row justify-content-center">
      <div class="col-lg-8">
        
        <!-- Messages d'alerte -->
        <div id="alertContainer"></div>

        <form id="reservationForm" class="p-4 border rounded shadow-sm bg-light" novalidate>
          <div class="row mb-3">
            <div class="col-md-6">
              <label for="nom" class="form-label">Nom *</label>
              <input type="text" class="form-control" id="nom" required>
            </div>
            <div class="col-md-6">
              <label for="prenom" class="form-label">Prénom *</label>
              <input type="text" class="form-control" id="prenom" required>
            </div>
          </div>

          <div class="row mb-3">
            <div class="col-md-6">
              <label for="email" class="form-label">Adresse e-mail *</label>
              <input type="email" class="form-control" id="email" required>
            </div>
            <div class="col-md-6">
              <label for="telephone" class="form-label">Téléphone *</label>
              <input type="tel" class="form-control" id="telephone" required>
            </div>
          </div>

          <div class="mb-3">
            <label for="activiteSelect" class="form-label">Activité choisie *</label>
            <select class="form-select" id="activiteSelect" required>
              <option value="" disabled selected>Choisissez une activité</option>
              <option value="A01" data-price="20">Découverte de la médina - Nabeul (20 TND)</option>
              <option value="A02" data-price="35">Atelier d'initiation à la poterie - Nabeul (35 TND)</option>
              <option value="A03" data-price="30">Parcours découverte de Kerkouane - Kerkouane (30 TND)</option>
              <option value="A04" data-price="25">Randonnée découverte - Djebel Abderrahmane (25 TND)</option>
              <option value="A05" data-price="40">Circuit du littoral - Kélibia (40 TND)</option>
              <option value="A06" data-price="25">Peinture sur céramique - Nabeul (25 TND)</option>
              <option value="A07" data-price="15">Découverte d'un marché local - Nabeul (15 TND)</option>
              <option value="A08" data-price="30">Promenade photographique - Hammamet (30 TND)</option>
            </select>
          </div>

          <div class="row mb-3">
            <div class="col-md-6">
              <label for="dateSouhaitee" class="form-label">Date souhaitée *</label>
              <input type="date" class="form-control" id="dateSouhaitee" required>
            </div>
            <div class="col-md-6">
              <label for="participants" class="form-label">Nombre de participants (1 à 6) *</label>
              <input type="number" class="form-control" id="participants" min="1" max="6" value="1" required>
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label d-block">Type de participation *</label>
            <div class="form-check form-check-inline">
              <input class="form-check-input" type="radio" name="typeParticipation" id="partIndiv" value="individuel" checked>
              <label class="form-check-label" for="partIndiv">Individuel</label>
            </div>
            <div class="form-check form-check-inline">
              <input class="form-check-input" type="radio" name="typeParticipation" id="partFamille" value="famille">
              <label class="form-check-label" for="partFamille">Famille</label>
            </div>
            <div class="form-check form-check-inline">
              <input class="form-check-input" type="radio" name="typeParticipation" id="partGroupe" value="groupe">
              <label class="form-check-label" for="partGroupe">Groupe</label>
            </div>
          </div>

          <div class="mb-3">
            <label for="commentaire" class="form-label">Commentaire (facultatif)</label>
            <textarea class="form-control" id="commentaire" rows="3"></textarea>
          </div>

          <div class="mb-3 form-check">
            <input type="checkbox" class="form-check-input" id="conditions" required>
            <label class="form-check-label" for="conditions">J'accepte les conditions de simulation (aucun paiement réel) *</label>
          </div>

          <!-- Bloc de calcul dynamique -->
          <div class="card bg-white p-3 mb-4 border">
            <h5>Estimation du tarif</h5>
            <p class="mb-1">Sous-total : <span id="valSousTotal" class="fw-bold">0.00</span> TND</p>
            <p class="mb-1">Remise (10% si &ge; 4 participants) : <span id="valRemise" class="fw-bold text-success">0.00</span> TND</p>
            <hr class="my-2">
            <p class="mb-0 fs-5">Total final : <span id="valTotal" class="fw-bold text-primary">0.00</span> TND</p>
          </div>

          <div class="d-flex gap-2">
            <button type="button" id="btnCalc" class="btn btn-secondary">Calculer / Actualiser</button>
            <button type="submit" class="btn btn-primary">Valider la simulation</button>
            <button type="reset" id="btnReset" class="btn btn-outline-danger">Réinitialiser</button>
          </div>
        </form>

        <!-- Récapitulatif de validation -->
        <div id="recapContainer" class="mt-4"></div>

      </div>
    </div>
  </main>

  <footer class="text-center py-4 bg-dark text-light mt-5">
    <div class="container">
      <p class="mb-1">&copy; 2026-2027 Cap Bon Explorer - ISET Nabeul</p>
      <a href="index.html" class="text-decoration-none text-light small">Retour à l'accueil</a>
    </div>
  </footer>

  <!-- Bootstrap 5.3.3 JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Votre script JS externe -->
  <script src="java/reservation.js"></script>
</body>
</html>
